name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: afyalink, POSTGRES_PASSWORD: afyalink_dev, POSTGRES_DB: afyalink_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U afyalink" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://afyalink:afyalink_dev@localhost:5432/afyalink_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: End-to-end (Docker Compose stack)
    runs-on: ubuntu-latest
    needs: quality
    env:
      E2E_BASE_URL: https://localhost:8443
      E2E_IGNORE_HTTPS: 'true'
      E2E_PLATFORM_EMAIL: ci-admin@afyalink.local
      E2E_PLATFORM_PASSWORD: Ci-platform-2026
    steps:
      - uses: actions/checkout@v7
      - name: Create CI environment
        run: |
          cat > .env <<EOT
          APP_ORIGIN=https://localhost:8443
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          REDIS_PASSWORD=$(openssl rand -hex 16)
          JWT_ACCESS_SECRET=$(openssl rand -base64 48)
          DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)
          HTTP_PORT=8080
          HTTPS_PORT=8443
          SEED_PLATFORM_ADMIN_EMAIL=${E2E_PLATFORM_EMAIL}
          SEED_PLATFORM_ADMIN_PASSWORD=${E2E_PLATFORM_PASSWORD}
          SEED_DEMO=false
          EOT
          ./scripts/generate-dev-certs.sh localhost
      - run: docker compose up -d --build --wait
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @afyalink/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        run: docker compose logs --tail=200
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report }

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
