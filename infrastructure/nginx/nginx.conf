# AfyaLink AI — edge proxy. TLS termination, rate limiting, security headers.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;

  # Do not log query strings (may contain search terms) — log path only.
  log_format main '$remote_addr - [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  upstream api { server api:4000; keepalive 16; }
  upstream web { server web:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Strict limit only on credential-guessing surfaces. Token refresh runs on every full page load, so it
    # uses the general API zone (the API also throttles it and revokes sessions on refresh-token reuse).
    location ~ ^/api/v1/(auth/login|auth/activate|clinics/register|contact)$ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api;
    }
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_read_timeout 60s;
      proxy_pass http://api;
    }
    location /_next/static/ {
      proxy_pass http://web;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://web;
    }
  }
}
