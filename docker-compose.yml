# AfyaLink AI — production-like stack (staging / pilot).
#   cp .env.example .env   # fill in secrets
#   ./scripts/generate-dev-certs.sh   # or mount real certificates into infrastructure/nginx/certs
#   docker compose up -d --build
name: afyalink

x-api-env: &api-env
  NODE_ENV: production
  PORT: "4000"
  APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
  DATABASE_URL: postgresql://${POSTGRES_USER:-afyalink}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-afyalink}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUST_PROXY: "true"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-AfyaLink AI <no-reply@example.com>}
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_USERNAME: ${SMS_USERNAME:-}
  SMS_SENDER_ID: ${SMS_SENDER_ID:-}
  PAYMENT_PROVIDER: sandbox

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afyalink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-afyalink}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  # One-shot: apply migrations and seed reference data (+ optional platform admin / demo data).
  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile, target: build }
    working_dir: /repo/apps/api
    command: ["sh", "-c", "npx prisma migrate deploy && npx ts-node --transpile-only prisma/seed.ts"]
    environment:
      <<: *api-env
      SEED_PLATFORM_ADMIN_EMAIL: ${SEED_PLATFORM_ADMIN_EMAIL:-}
      SEED_PLATFORM_ADMIN_PASSWORD: ${SEED_PLATFORM_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *api-env
      WORKERS_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [backend, frontend]

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    restart: unless-stopped
    init: true
    depends_on: [api]
    networks: [frontend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on: [api, web]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/api/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [frontend]

volumes:
  pgdata:
  redisdata:

networks:
  backend:
  frontend:
